const rnd = (arr) => arr[Math.floor(Math.random() * arr.length)];
const hex = (n) => Array.from({ length: n }, () => "0123456789abcdef"[Math.floor(Math.random() * 16)]).join("");
const genPanTail = () => String(Math.floor(1000 + Math.random() * 9000));
const fmtPar = (raw) => (raw || "").replace(/(.{2})/g, "$1 ").trim();

// posizione deterministica su mappa a partire da una stringa (par o merchant id) — stabile, mai sovrapposta al pin centrale
function hashPos(str) {
  let h = 0;
  const s = str || "x";
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  let x = 8 + (h % 84);
  let y = 10 + (Math.floor(h / 84) % 56);
  if (x > 36 && x < 64 && y > 32 && y < 58) x = x < 50 ? Math.max(8, x - 26) : Math.min(92, x + 26);
  return { x, y };
}

function seedAudience() {
  return Array.from({ length: 24 }).map((_, i) => {
    const coins = 200 + Math.floor(Math.random() * 6000);
    const par = "PAR-" + hex(10);
    const pos = hashPos(par + i);
    return {
      par, quartiere: rnd(QUARTIERI), topCategory: rnd(Object.keys(CATS)),
      txCount: 3 + Math.floor(Math.random() * 22), coins, tier: tierFromCoins(coins),
      x: pos.x, y: pos.y,
    };
  });
}

// storico fisso: 50 acquisti, dominati da pizza / burger / coffee — non cambia mai con la zona
function seedHistory() {
  const now = Date.now();
  const plan = [
    { merchants: ["m4", "m7"], n: 18, min: 9, max: 23 },
    { merchants: ["m3"], n: 16, min: 11, max: 26 },
    { merchants: ["m1", "m8"], n: 12, min: 1.5, max: 4.5 },
    { merchants: ["m2", "m6"], n: 2, min: 12, max: 22 },
    { merchants: ["m5"], n: 2, min: 4, max: 9 },
  ];
  const txs = [];
  let i = 0;
  plan.forEach((p) => {
    for (let k = 0; k < p.n; k++) {
      const pickedId = rnd(p.merchants);
      const m = MERCHANTS.find((x) => x.id === pickedId);
      txs.push({
        id: "seed-" + i++, merchantId: m.id, merchantName: m.name, category: m.category,
        quartiere: m.quartiere, amount: (p.min + Math.random() * (p.max - p.min)).toFixed(2),
        ts: now - Math.floor(Math.random() * 45) * 86400000 - Math.random() * 60000000,
      });
    }
  });
  return txs.sort((a, b) => b.ts - a.ts);
}

function CatIcon({ cat, size = 16, style = {} }) {
  const C = CATS[cat]?.icon || Coffee;
  return <C size={size} style={{ color: CATS[cat]?.color, ...style }} />;
}
function TierBadge({ tier }) {
  return <span className="text-[9px] font-bold px-2 py-1 rounded-full shrink-0" style={{ background: TIER_BG[tier], color: TIER_COLOR[tier] }}>{tier}</span>;
}

// ================= APP =================
export default function App() {
  const [persona, setPersona] = useState("cardholder");
  const [showInfo, setShowInfo] = useState(false);

  const [onboarded, setOnboarded] = useState(false);
  const [obStep, setObStep] = useState(0);
  const [parInput, setParInput] = useState("");
  const [par, setPar] = useState("");
  const [pans, setPans] = useState({ physical: "", apple: "", google: "" });
  const [consentGeo, setConsentGeo] = useState(true);
  const [consentName, setConsentName] = useState(false);
  const [name, setName] = useState("");
  const [device, setDevice] = useState("physical");
  const [transactions, setTransactions] = useState([]);

  const [entering, setEntering] = useState(null);
  const [arrived, setArrived] = useState(false);
  const [currentZone, setCurrentZone] = useState(null);

  const [activePopup, setActivePopup] = useState(null);
  const [dismissedOfferIds, setDismissedOfferIds] = useState([]);
  const [acceptedOfferIds, setAcceptedOfferIds] = useState([]);
  const [receivedOffers, setReceivedOffers] = useState([]);

  const [audience] = useState(seedAudience);
  const [offers, setOffers] = useState([
    { id: "o1", merchantId: "m4", category: "pizza", quartiere: "Porta Romana", discount: 15, message: "Una vera Margherita, -15% solo per te.", personalizedFor: null, ts: Date.now() - 86400000 },
  ]);
  const [selectedMerchant, setSelectedMerchant] = useState("m4");
  const [presetIdx, setPresetIdx] = useState(0);
  const [formDiscount, setFormDiscount] = useState(15);
  const [formMsg, setFormMsg] = useState(PRESETS_BY_CATEGORY.pizza[0].message);
  const [pushedToast, setPushedToast] = useState(null);
  const [incomingPush, setIncomingPush] = useState(null);

  const merchant = MERCHANTS.find((m) => m.id === selectedMerchant);

  // quando l'utente arriva/cambia zona, allinea di default il merchant selezionato a quella zona
  useEffect(() => {
    if (arrived && currentZone && merchant?.quartiere !== currentZone) {
      const inZone = MERCHANTS.find((m) => m.quartiere === currentZone);
      if (inZone) setSelectedMerchant(inZone.id);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [arrived, currentZone]);

  useEffect(() => {
    const presets = PRESETS_BY_CATEGORY[merchant?.category] || [];
    setPresetIdx(0);
    if (presets[0]) { setFormDiscount(presets[0].discount); setFormMsg(presets[0].message); }
  }, [selectedMerchant]);

  useEffect(() => {
    if (persona === "cardholder" && incomingPush) {
      const t = setTimeout(() => setIncomingPush(null), 6500);
      return () => clearTimeout(t);
    }
  }, [persona, incomingPush]);

  const affinity = useMemo(() => {
    const counts = {};
    transactions.forEach((t) => (counts[t.category] = (counts[t.category] || 0) + 1));
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    return { counts, top3: sorted.slice(0, 3).map(([c]) => c) };
  }, [transactions]);

  const { coins, tier, totalSpend } = useMemo(() => {
    const total = transactions.reduce((s, t) => s + parseFloat(t.amount), 0);
    const c = Math.round(total * 8);
    return { coins: c, tier: tierFromCoins(c), totalSpend: total };
  }, [transactions]);

  function registerCard() {
    setPar(parInput);
    setPans({ physical: genPanTail(), apple: genPanTail(), google: genPanTail() });
    setObStep(2);
  }

  function finishOnboarding() {
    setTransactions(seedHistory());
    setOnboarded(true);
  }

  function selectZone(zone) {
    setEntering(zone);
    setTimeout(() => {
      setCurrentZone(zone);
      setArrived(true);
      setEntering(null);
    }, 950);
  }

  // targetPar: se valorizzato è un'offerta personalizzata per quel PAR, altrimenti è un'offerta standard di zona
  function pushOffer(targetPar) {
    const id = "o" + Date.now();
    const newOffer = {
      id, merchantId: selectedMerchant, category: merchant.category, quartiere: merchant.quartiere,
      discount: Number(formDiscount) || 10, message: formMsg || "Un'offerta pensata per i tuoi gusti.",
      personalizedFor: targetPar || null, ts: Date.now(),
    };
    setOffers([newOffer, ...offers]);

    const reaches = targetPar
      ? onboarded && targetPar === par
      : onboarded && arrived && currentZone === merchant.quartiere && affinity.top3.includes(merchant.category);
    const audienceCount = audience.filter((a) => a.quartiere === merchant.quartiere && a.topCategory === merchant.category).length + (reaches && !targetPar ? 1 : 0);
    setPushedToast({ target: audienceCount, reachable: reaches, personalized: !!targetPar, parLabel: targetPar });
    setTimeout(() => setPushedToast(null), 3800);

    if (reaches) {
      const withName = { ...newOffer, merchantName: merchant.name };
      setReceivedOffers((prev) => [withName, ...prev]);
      setIncomingPush(withName);
    }
  }

  // coerenza: un merchant vede solo i PAR (finti o reale) la cui categoria preferita coincide con la propria — mai tutti
  const merchantAudience = useMemo(() => {
    const iSeeYou = onboarded && arrived && currentZone === merchant?.quartiere && affinity.top3.includes(merchant?.category);
    const pos = hashPos(par);
    const live = iSeeYou ? [{ par, quartiere: currentZone, topCategory: merchant.category, txCount: transactions.length, coins, tier, live: true, x: pos.x, y: pos.y }] : [];
    const matchedSeed = audience.filter((a) => a.quartiere === merchant?.quartiere && a.topCategory === merchant?.category);
    return [...live, ...matchedSeed];
  }, [audience, onboarded, arrived, currentZone, affinity, par, transactions, merchant, coins, tier]);

  let cardholderScreen;
  if (!onboarded) {
    cardholderScreen = (
      <Onboarding obStep={obStep} setObStep={setObStep} parInput={parInput} setParInput={setParInput}
        registerCard={registerCard} par={par}
        consentGeo={consentGeo} setConsentGeo={setConsentGeo} consentName={consentName} setConsentName={setConsentName}
        name={name} setName={setName} finishOnboarding={finishOnboarding} />
    );
  } else if (entering) {
    cardholderScreen = <EnteringAnimation zone={entering} />;
  } else if (!arrived) {
    cardholderScreen = <ArrivalScreen onSelect={selectZone} />;
  } else {
    cardholderScreen = (
      <CardholderHome par={par} pans={pans} device={device} setDevice={setDevice}
        consentName={consentName} name={name} transactions={transactions} affinity={affinity}
        currentZone={currentZone} onChangeZone={() => setArrived(false)}
        offers={offers} receivedOffers={receivedOffers} acceptedOfferIds={acceptedOfferIds} onOpenOffer={(o) => setActivePopup(o)} />
    );
  }

  return (
    <PhoneFrame
      persona={persona} setPersona={setPersona}
      notification={persona === "cardholder" ? incomingPush : null}
      onOpenNotification={() => { setActivePopup(incomingPush); setIncomingPush(null); }}
      onDismissNotification={() => setIncomingPush(null)}
      onInfo={() => setShowInfo(true)}
    >
      {persona === "cardholder" && cardholderScreen}
      {persona === "merchant" && (
        <MerchantDashboard
          selectedMerchant={selectedMerchant} setSelectedMerchant={setSelectedMerchant}
          merchant={merchant} merchantAudience={merchantAudience} offers={offers} pushOffer={pushOffer}
          presetIdx={presetIdx} setPresetIdx={setPresetIdx}
          formDiscount={formDiscount} setFormDiscount={setFormDiscount}
          formMsg={formMsg} setFormMsg={setFormMsg} pushedToast={pushedToast}
          cardholderStatus={{ onboarded, arrived, currentZone, topCats: affinity.top3 }}
          acceptedOfferIds={acceptedOfferIds}
        />
      )}
      {persona === "loyalty" && <LoyaltyPage coins={coins} tier={tier} totalSpend={totalSpend} txCount={transactions.length} started={onboarded} />}

      {activePopup && (
        <OfferPopup
          offer={activePopup}
          alreadyAccepted={acceptedOfferIds.includes(activePopup.id)}
          onDecline={() => { setDismissedOfferIds([...dismissedOfferIds, activePopup.id]); setActivePopup(null); }}
          onAccept={() => { setDismissedOfferIds([...dismissedOfferIds, activePopup.id]); setAcceptedOfferIds([...acceptedOfferIds, activePopup.id]); setActivePopup(null); }}
        />
      )}
      {showInfo && <InfoModal onClose={() => setShowInfo(false)} />}
    </PhoneFrame>
  );
}

// rileva se l'app gira "installata" (PWA standalone su Android o Add to Home Screen su iOS)
function useIsStandalone() {
  const [standalone, setStandalone] = useState(false);
  useEffect(() => {
    const mq = window.matchMedia ? window.matchMedia("(display-mode: standalone)") : null;
    const check = () => setStandalone(!!(mq && mq.matches) || window.navigator.standalone === true);
    check();
    if (mq && mq.addEventListener) mq.addEventListener("change", check);
    return () => { if (mq && mq.removeEventListener) mq.removeEventListener("change", check); };
  }, []);
  return standalone;
}

// ---------- push notification banner ----------
function PushBanner({ notification, onOpen, onDismiss }) {
  const [dragY, setDragY] = useState(0);
  const dragging = useRef(false);
  const startY = useRef(0);
  const moved = useRef(false);
  const m = MERCHANTS.find((mm) => mm.id === notification.merchantId);

  function down(e) { dragging.current = true; moved.current = false; startY.current = e.touches ? e.touches[0].clientY : e.clientY; }
  function move(e) {
    if (!dragging.current) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const delta = y - startY.current;
    if (delta < 0) { setDragY(delta); moved.current = true; }
  }
  function up() { if (!dragging.current) return; dragging.current = false; if (dragY < -26) onDismiss(); else setDragY(0); }

  return (
    <div onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={up} onTouchStart={down} onTouchMove={move} onTouchEnd={up}
      onClick={() => { if (!moved.current) onOpen(); }} className="absolute z-40 cursor-grab"
      style={{ top: 54, left: 12, right: 12, transform: `translateY(${dragY}px)`, transition: dragging.current ? "none" : "transform 0.25s ease", animation: "pushSlideIn 0.5s cubic-bezier(.22,.9,.25,1)" }}>
      <div className="rounded-[22px] p-3.5 flex items-start gap-3" style={{ background: "rgba(24,24,34,0.78)", backdropFilter: "blur(26px)", WebkitBackdropFilter: "blur(26px)", border: "1px solid rgba(255,255,255,0.14)", boxShadow: "0 24px 48px -16px rgba(0,0,0,0.6)" }}>
        <div className="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 mt-0.5" style={{ background: notification.personalizedFor ? GOLD : PRIMARY, animation: "iconWiggle 0.5s ease-in-out 0.6s 2" }}><Radio size={17} color="#fff" /></div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center justify-between"><span className="text-[11px] font-bold" style={{ color: INK }}>parlink</span><span className="text-[10px] font-medium" style={{ color: MUTED }}>adesso</span></div>
          <div className="text-[13px] font-bold mt-0.5 truncate" style={{ color: INK }}>{m?.name} · -{notification.discount}%</div>
          <div className="text-[11.5px] mt-0.5 leading-snug" style={{ color: "rgba(245,246,251,0.75)", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{notification.message}</div>
        </div>
        <button onClick={(e) => { e.stopPropagation(); onDismiss(); }} className={`p-1 shrink-0 ${TAP}`}><X size={13} style={{ color: MUTED }} /></button>
      </div>
    </div>
  );
}

        <div className="flex flex-col gap-2 mb-3.5">
          {presets.map((p, i) => (
            <button key={i} onClick={() => { setPresetIdx(i); setFormDiscount(p.discount); setFormMsg(p.message); }} className={`text-left px-3.5 py-2.5 rounded-2xl ${TAP}`} style={presetIdx === i ? { background: PRIMARY_SOFT, border: `1.5px solid ${PRIMARY}` } : { background: "rgba(255,255,255,0.05)", border: "1.5px solid transparent" }}>
              <div className="text-[12.5px] font-bold" style={{ color: presetIdx === i ? PRIMARY : INK }}>{p.title}</div>
            </button>
          ))}
        </div>
        <div className="flex items-center gap-2 mb-3">
          <span className="text-[12px] font-medium" style={{ color: MUTED }}>Sconto</span>
          <input type="number" value={formDiscount} onChange={(e) => setFormDiscount(e.target.value)} className="w-16 px-2 py-2 rounded-xl text-[12.5px] font-semibold outline-none" style={{ background: "rgba(255,255,255,0.05)", border: `1px solid ${BORDER}`, color: INK }} />
          <span className="text-[12px] font-medium" style={{ color: MUTED }}>%</span>
        </div>
        <textarea value={formMsg} onChange={(e) => setFormMsg(e.target.value)} rows={2} placeholder="Messaggio per il cardholder" className="w-full px-3.5 py-2.5 rounded-2xl text-[12.5px] outline-none resize-none placeholder-white/25" style={{ background: "rgba(255,255,255,0.05)", border: `1px solid ${BORDER}`, color: INK }} />
        <button onClick={handleSend} className={`w-full mt-3.5 py-3.5 rounded-2xl text-[13.5px] font-bold flex items-center justify-center gap-1.5 ${TAP}`} style={{ background: composerTarget ? GOLD : ACCENT, color: "#fff", boxShadow: `0 12px 22px -8px ${(composerTarget ? GOLD : ACCENT)}88` }}>
          <Zap size={15} /> {composerTarget ? "Invia offerta personalizzata" : "Pubblica offerta standard in zona"}
        </button>
      </div>

      <div className="text-[11px] font-bold uppercase tracking-[0.12em] mb-2.5" style={{ color: MUTED }}>Offerte del punto vendita</div>
      <div className="space-y-2">
        {merchantOffers.length === 0 && <div className="text-[12.5px] py-4 text-center" style={{ color: MUTED }}>Nessuna offerta ancora.</div>}
        {merchantOffers.map((o) => (
          <div key={o.id} className="flex items-center gap-3 rounded-2xl p-3" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
            <CatIcon cat={o.category} size={15} />
            <div className="flex-1 min-w-0">
              <div className="text-[12.5px] font-bold" style={{ color: INK }}>-{o.discount}% · {CATS[o.category].label} · {o.quartiere}</div>
              <div className="text-[10.5px] truncate" style={{ color: MUTED }}>{o.message}</div>
            </div>
            <span className="text-[9px] font-bold px-2 py-1 rounded-full shrink-0" style={{ background: o.personalizedFor ? GOLD_SOFT : "rgba(255,255,255,0.08)", color: o.personalizedFor ? "rgba(255,210,140,0.9)" : MUTED }}>{o.personalizedFor ? "Personalizzata" : "Standard"}</span>
          </div>
        ))}
      </div>

      {pushedToast && (
        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 px-4 py-3 rounded-2xl text-[12px] font-bold flex items-center gap-2 z-50 max-w-[300px] text-center" style={{ background: pushedToast.reachable ? PRIMARY_GRAD : "rgba(20,20,30,0.85)", color: "#fff", backdropFilter: "blur(16px)", WebkitBackdropFilter: "blur(16px)", boxShadow: pushedToast.reachable ? `0 14px 28px -10px ${PRIMARY}99` : "0 14px 28px -10px rgba(0,0,0,0.5)", border: "1px solid rgba(255,255,255,0.12)" }}>
          {pushedToast.reachable ? <Check size={14} className="shrink-0" /> : <EyeOff size={14} className="shrink-0" />}
          {pushedToast.personalized
            ? (pushedToast.reachable ? "Offerta personalizzata inviata — comparirà nella tab Utente" : `Offerta personalizzata inviata a ${pushedToast.parLabel}`)
            : (pushedToast.reachable ? `Offerta standard pubblicata — in target ${pushedToast.target} PAR` : "Offerta standard pubblicata in zona")}
        </div>
      )}
    </div>
  );
}

// ---------- quartiere map (lato merchant) ----------
function QuartiereMap({ audience, quartiere, selectedDot, setSelectedDot, liveAccepted }) {
  const streets = STREETS[quartiere] || ["Via Roma", "Corso Italia"];

  return (
    <div>
      <div className="rounded-2xl overflow-hidden relative" style={{ background: "rgba(255,255,255,0.035)", border: `1px solid ${BORDER}` }}>
        <svg viewBox="0 0 100 70" className="w-full" style={{ height: 210 }}>
          <defs><filter id="pinShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.8" floodColor="#000" floodOpacity="0.28" /></filter></defs>
          <rect x="0" y="0" width="100" height="70" fill="rgba(255,255,255,0.035)" />
          {BLOCKS.map((b, i) => <rect key={i} x={b.x} y={b.y} width={b.w} height={b.h} rx="1.4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)" strokeWidth="0.4" />)}
          <ellipse cx="20" cy="30" rx="10" ry="7" fill="rgba(44,239,196,0.10)" stroke="rgba(44,239,196,0.22)" strokeWidth="0.5" />
          <ellipse cx="80" cy="60" rx="9" ry="6" fill="rgba(44,239,196,0.10)" stroke="rgba(44,239,196,0.22)" strokeWidth="0.5" />
          <line x1="0" y1="20" x2="100" y2="20" stroke="rgba(255,255,255,0.10)" strokeWidth="1.1" />
          <line x1="0" y1="46" x2="100" y2="46" stroke="rgba(255,255,255,0.16)" strokeWidth="1.4" />
          <line x1="35" y1="0" x2="35" y2="70" stroke="rgba(255,255,255,0.10)" strokeWidth="1.1" />
          <line x1="68" y1="0" x2="68" y2="70" stroke="rgba(255,255,255,0.10)" strokeWidth="1.1" />
          <text x="37" y="19" fontSize="2.6" fill="rgba(245,246,251,0.35)" style={{ fontFamily: "ui-monospace, monospace" }}>{streets[0]}</text>
          <text x="2" y="49.5" fontSize="2.6" fill="rgba(245,246,251,0.35)" style={{ fontFamily: "ui-monospace, monospace" }}>{streets[1]}</text>
          <g transform="translate(91,10)"><circle r="4.2" fill="#fff" stroke="rgba(255,255,255,0.10)" strokeWidth="0.5" /><path d="M0,-2.6 L1.1,0.6 L0,-0.4 L-1.1,0.6 Z" fill={ACCENT} /><text x="0" y="6.5" fontSize="2.2" fill={MUTED} textAnchor="middle">N</text></g>
          <g transform="translate(50,46)" filter="url(#pinShadow)">
            <circle r="6.5" fill={ACCENT} opacity="0.16"><animate attributeName="r" values="6.5;10.5;6.5" dur="2.6s" repeatCount="indefinite" /><animate attributeName="opacity" values="0.2;0;0.2" dur="2.6s" repeatCount="indefinite" /></circle>
            <path d="M0,-4.6 C2.6,-4.6 4.6,-2.6 4.6,0 C4.6,3.4 0,7.8 0,7.8 C0,7.8 -4.6,3.4 -4.6,0 C-4.6,-2.6 -2.6,-4.6 0,-4.6 Z" fill={ACCENT} /><circle r="1.6" fill="#fff" />
          </g>
          {audience.map((a, i) => (
            <g key={i} transform={`translate(${a.x},${a.y})`} onClick={() => setSelectedDot(a.par === selectedDot ? null : a.par)} style={{ cursor: "pointer" }} filter="url(#pinShadow)">
              {a.live && <circle r="3.6" fill={MINT} opacity="0.32"><animate attributeName="r" values="3.6;7;3.6" dur="1.6s" repeatCount="indefinite" /><animate attributeName="opacity" values="0.4;0;0.4" dur="1.6s" repeatCount="indefinite" /></circle>}
              <circle r={selectedDot === a.par ? 2.9 : 2.1} fill={a.live ? MINT : CATS[a.topCategory].color} stroke="#fff" strokeWidth={selectedDot === a.par ? 0.8 : 0.6} />
              {a.live && liveAccepted && (
                <g transform="translate(0,-5.2)">
                  <path d="M-2.4,1.6 L-2.9,-1.6 L-1.1,-0.1 L0,-2.2 L1.1,-0.1 L2.9,-1.6 L2.4,1.6 Z" fill={GOLD} stroke="#fff" strokeWidth="0.35" />
                </g>
              )}
            </g>
          ))}
        </svg>
        <div className="absolute top-2 left-2 text-[9.5px] font-bold px-2 py-1 rounded-full flex items-center gap-1" style={{ background: "rgba(255,255,255,0.9)", color: INK, border: `1px solid ${BORDER}` }}><MapPin size={10} style={{ color: ACCENT }} /> {quartiere}</div>
        <div className="absolute bottom-2 right-2 text-[9px] font-semibold px-2 py-1 rounded-md" style={{ background: "rgba(255,255,255,0.9)", color: MUTED }}>{audience.length} PAR in target</div>
      </div>
      <div className="text-[10.5px] mt-2 px-0.5" style={{ color: MUTED }}>Tocca un puntino per selezionare quel PAR e inviargli un'offerta personalizzata.</div>
    </div>
  );
}

// ---------- loyalty page ----------
function LoyaltyPage({ coins, tier, totalSpend, txCount, started }) {
  if (!started) {
    return (
      <div className="px-5 pt-10 pb-8 h-full flex flex-col items-center text-center" style={{ animation: "popIn 0.3s ease-out" }}>
        <div className="w-14 h-14 rounded-2xl flex items-center justify-center mb-4" style={{ background: TIER_BG.Gold }}><Award size={24} style={{ color: TIER_COLOR.Gold }} /></div>
        <div className="text-[15px] font-bold mb-1.5" style={{ color: INK }}>Il tuo saldo B€have</div>
        <div className="text-[13px] leading-relaxed" style={{ color: MUTED }}>Registra il tuo PAR nella tab Utente per iniziare ad accumulare punti su ogni acquisto.</div>
      </div>
    );
  }
  const next = tier === "Bronze" ? 1500 : tier === "Silver" ? 4000 : null;
  const progress = next ? Math.min(100, (coins / next) * 100) : 100;
  return (
    <div className="px-5 pt-3 pb-8" style={{ animation: "popIn 0.3s ease-out" }}>
      <div className="mb-1"><div className="text-[12px] font-medium" style={{ color: MUTED }}>Il tuo saldo</div><h1 className="text-[20px] font-extrabold" style={{ color: INK }}>B€have</h1></div>

      <div className="rounded-[26px] p-5 mt-4 mb-5 relative overflow-hidden" style={{ background: `linear-gradient(135deg, ${GOLD}, #FF8A3D)`, boxShadow: `0 20px 40px -14px ${GOLD}88` }}>
        <div className="absolute -right-8 -top-10 w-40 h-40 rounded-full" style={{ background: "rgba(255,255,255,0.12)" }} />
        <div className="text-[11px] uppercase tracking-[0.15em] text-white/80 relative">Saldo attuale</div>
        <div className="text-[34px] font-extrabold text-white mt-1 relative">{coins.toLocaleString("it-IT")} <span className="text-[15px] font-semibold">pt</span></div>
        <span className="text-[11px] font-bold px-2.5 py-1 rounded-full inline-block mt-2 relative" style={{ background: "rgba(255,255,255,0.25)", color: "#fff" }}>Livello {tier}</span>
      </div>

      {next && (
        <div className="rounded-2xl p-4 mb-5" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
          <div className="flex justify-between text-[11px] font-semibold mb-2" style={{ color: MUTED }}><span>Verso {tier === "Bronze" ? "Silver" : "Gold"}</span><span>{coins}/{next} pt</span></div>
          <div className="h-2.5 rounded-full" style={{ background: "rgba(255,255,255,0.08)" }}><div className="h-2.5 rounded-full" style={{ width: `${progress}%`, background: GOLD }} /></div>
        </div>
      )}

      <div className="grid grid-cols-2 gap-2.5 mb-5">
        <div className="rounded-2xl p-3.5" style={{ background: CARD, border: `1px solid ${BORDER}` }}><div className="text-[20px] font-extrabold" style={{ color: INK }}>€{totalSpend.toFixed(0)}</div><div className="text-[10px] font-medium" style={{ color: MUTED }}>spesi tracciati dal PAR</div></div>
        <div className="rounded-2xl p-3.5" style={{ background: CARD, border: `1px solid ${BORDER}` }}><div className="text-[20px] font-extrabold" style={{ color: INK }}>{txCount}</div><div className="text-[10px] font-medium" style={{ color: MUTED }}>acquisti registrati</div></div>
      </div>

      <div className="rounded-2xl p-4" style={{ background: PRIMARY_SOFT, border: `1px solid ${PRIMARY}22` }}>
        <div className="text-[12.5px] leading-relaxed" style={{ color: INK }}>
          I B€have si accumulano su ogni acquisto tracciato dal tuo PAR e sono spendibili in tutti i negozi del circuito, indipendentemente da dove li hai guadagnati. Un livello più alto segnala ai merchant un cliente più affidabile — e può valere offerte migliori.
        </div>
      </div>
    </div>
  );
}

// ---------- info modal ----------
function InfoModal({ onClose }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(10,10,20,0.5)" }}>
      <div className="w-full max-w-md rounded-[28px] p-5" style={{ ...glass({ background: "rgba(20,20,30,0.72)" }), animation: "popIn 0.3s ease-out" }}>
        <div className="flex items-center justify-between mb-4"><div className="flex items-center gap-1.5"><Radio size={14} style={{ color: PRIMARY }} /><span className="text-[14px] font-bold" style={{ color: INK }}>Come funziona parlink</span></div><button onClick={onClose} className={TAP}><X size={16} style={{ color: MUTED }} /></button></div>
        <ul className="text-[12.5px] leading-relaxed space-y-2.5" style={{ color: "rgba(245,246,251,0.75)" }}>
          <li><b style={{ color: PRIMARY }}>PAR</b> — identificativo persistente ma anonimo, condiviso da tutti i PAN (fisica, Apple Pay, Google Pay) di una stessa carta o conto congiunto.</li>
          <li><b style={{ color: PRIMARY }}>Zona</b> — arrivando in un quartiere il tuo PAR diventa visibile solo ai merchant le cui categorie rientrano nelle tue prime 3 preferenze, mai agli altri.</li>
          <li><b style={{ color: PRIMARY }}>Offerta standard</b> — pubblicata da un merchant per la sua zona, visibile a chiunque ci passi vicino.</li>
          <li><b style={{ color: GOLD }}>Offerta personalizzata</b> — un merchant seleziona un PAR specifico tra quelli in target e gli invia un'offerta dedicata.</li>
          <li><b style={{ color: PRIMARY }}>B€have</b> — punti loyalty accumulati su ogni acquisto, spendibili in tutto il circuito.</li>
          <li>Questo è un <b>prototipo simulato</b>: nessun dato reale di pagamento viene letto o trasmesso.</li>
        </ul>
      </div>
    </div>
  );
}


const root = createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
